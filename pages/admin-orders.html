<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../assets/reallogo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=optional">
    <title>Admin | Order Management</title>
    <link rel="stylesheet" href="../css/admin-homepage.css?v=4">
    <link rel="stylesheet" href="../css/sublimation-theme.css?v=4">
</head>
<body class="admin-page">
    <div class="admin-shell">
        <aside class="admin-sidebar" aria-label="Admin sidebar">
            <div class="sidebar-brand">
                <img class="brand-logo" src="../assets/reallogo.png" alt="Alix Vintage logo">
                <div class="brand-text">
                    <div class="brand-name">Alix Vintage</div>
                    <div class="brand-sub">Admin Dashboard</div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Main Menu</div>
                <nav class="sidebar-nav" aria-label="Main menu">
                    <a href="admin-homepage.html" class="nav-item">Dashboard</a>
                    <a href="admin-orders.html" class="nav-item active">Order Management</a>
                </nav>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Product</div>
                <nav class="sidebar-nav" aria-label="Product menu">
                    <a href="admin-products.html" class="nav-item">Add / Manage Products</a>
                    <a href="admin-product-list.html" class="nav-item">Product List (Store)</a>
                </nav>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">System</div>
                <nav class="sidebar-nav" aria-label="System menu">
                    <a href="admin-messages.html" class="nav-item">Messages</a>
                </nav>
            </div>
        </aside>

        <div class="admin-main">
            <div class="topbar" role="banner">
                <div class="topbar-title">Order Management</div>

                <div class="topbar-right">
                    <div class="topbar-search" role="search">
                        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="M20 20l-3.5-3.5"></path>
                        </svg>
                        <input class="search-input" id="orderSearch" type="search" placeholder="Search by order ID..." aria-label="Search orders">
                    </div>

                    <a class="icon-btn" href="admin-messages.html" aria-label="Messages">
                        <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 4h16v12H5.2L4 17.2V4z"></path>
                            <path d="M4 6l8 6 8-6"></path>
                        </svg>
                    </a>

                    <button class="admin-menu" type="button" aria-label="Admin menu">
                        <span class="admin-avatar" aria-hidden="true">AD</span>
                        <span class="admin-name">Admin</span>
                        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 9l6 6 6-6"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="page-content">
                <section class="panel panel-wide" aria-label="Orders">
                    <div class="panel-head">
                        <h2 class="panel-title">All Orders</h2>
                        <div class="filter-row" aria-label="Filters">
                            <select class="field-input" id="statusFilter" aria-label="Filter by status">
                                <option value="">All</option>
                                <option value="Pending">Pending</option>
                                <option value="Awaiting Payment">Awaiting Payment</option>
                                <option value="Proofing">Proofing</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Awaiting Final Payment">Awaiting Final Payment</option>
                                <option value="Ready to Ship">Ready to Ship</option>
                                <option value="On Transit">On Transit</option>
                                <option value="Completed">Completed</option>
                            </select>
                            <select class="field-input" id="typeFilter" aria-label="Filter by type">
                                <option value="">All Types</option>
                                <option value="fixed">Fixed</option>
                                <option value="custom">Custom</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-wrap">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Type</th>
                                    <th>Workflow Status</th>
                                    <th>Total</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTbody"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="../js/ui-dialog.js"></script>
    <script src="../js/auth-client.js"></script>
    <script src="../js/admin-auth.js"></script>
    <script src="../js/admin-realtime-messages.js"></script>
    <script src="../js/admin-store.js"></script>
    <script src="../js/admin-orders.js"></script>
</body>
</html>
