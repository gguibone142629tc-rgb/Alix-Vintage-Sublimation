<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../assets/reallogo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=optional">
    <title>Notifications | Alix Vintage</title>
    <link rel="stylesheet" href="../css/order-history.css?v=4">
    <link rel="stylesheet" href="../css/notifications.css?v=1">
    <link rel="stylesheet" href="../css/sublimation-theme.css?v=3">
</head>
<body>
    <header>
        <div class="nav">
            <a class="logo-wrap" href="homepage.html" aria-label="Go to homepage">
                <img src="../assets/reallogo.png" alt="Alix Vintage logo">
                <span>ALIX VINTAGE</span>
            </a>
            <nav>
                <ul>
                    <li><a href="categories.html" class="nav-shop-link">SHOP NOW</a></li>
                </ul>
            </nav>
            <div class="nav-icons" aria-label="Account and cart">
                <a class="nav-contact-link" href="contact-us.html">Contact</a>
                <a class="nav-login-btn-link is-hidden" href="login.html">Log In</a>
                <div class="nav-account-menu">
                    <a class="nav-account-link is-hidden" href="#" aria-label="Account menu">
                        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z" />
                            <path d="M4 20a8 8 0 0 1 16 0" />
                        </svg>
                    </a>
                    <div class="nav-account-dropdown is-hidden" role="menu">
                        <a class="nav-logout-btn-link" href="#" role="menuitem">Log Out</a>
                    </div>
                </div>
                <a class="nav-order-link is-hidden" href="order-history.html" aria-label="Order history">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 6h14l-2 9H8L6 6z" />
                        <path d="M6 6H4" />
                        <circle cx="9" cy="19" r="1" />
                        <circle cx="17" cy="19" r="1" />
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main class="notifications-page">
        <aside class="sidebar">
            <a href="order-tracking.html" class="sidebar-item">
                <img class="sidebar-icon" src="../assets/icons/Order.png" alt="">
                Orders
            </a>
            <a href="order-history.html" class="sidebar-item">
                <img class="sidebar-icon" src="../assets/icons/Order_History.png" alt="">
                Order History
            </a>
            <a href="account-settings.html" class="sidebar-item">
                <img class="sidebar-icon" src="../assets/icons/Settings.png" alt="">
                Account Settings
            </a>
        </aside>

        <section class="content">
            <div class="notifications-head">
                <div class="notifications-title">
                    <svg class="title-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                    </svg>
                    <h1>Notifications</h1>
                    <span id="notifNewBadge" class="new-badge is-hidden">0 new</span>
                </div>
                <div class="notifications-actions">
                    <button id="markAllReadBtn" class="mark-all-btn" type="button">Mark all as read</button>
                    <button id="clearNotifsBtn" class="mark-all-btn" type="button">Clear notifications</button>
                </div>
            </div>

            <div class="notif-tabs" role="tablist" aria-label="Notification filters">
                <button class="notif-tab active" type="button" data-filter="all">All</button>
                <button class="notif-tab" type="button" data-filter="accepted">Accepted</button>
                <button class="notif-tab" type="button" data-filter="in_progress">In progress</button>
                <button class="notif-tab" type="button" data-filter="shipped">Shipped</button>
                <button class="notif-tab" type="button" data-filter="completed">Completed</button>
            </div>

            <div id="notifRoot"></div>
        </section>
    </main>

    <footer id="contact-us" class="site-footer"></footer>

    <script src="../js/nav-auth.js?v=7"></script>
    <script src="../js/ui-dialog.js"></script>
    <script src="../js/auth-client.js?v=3"></script>
    <script src="../js/cart-client.js?v=2"></script>
    <script src="../js/order-notifications.js?v=8"></script>
    <script>
        const escapeHtml = (value) => String(value || '').replace(/[&<>"']/g, (ch) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
        }[ch] || ch));

        const isAuthed = () => {
            if (window.AlixAuth?.getToken) {
                const token = window.AlixAuth.getToken();
                if (!token) return false;
                return window.AlixAuth.isTokenValid ? window.AlixAuth.isTokenValid(token) : true;
            }

            try {
                const token = sessionStorage.getItem('alix_auth_token') || localStorage.getItem('alix_auth_token');
                return Boolean(token);
            } catch {
                return Boolean(localStorage.getItem('alix_auth_token'));
            }
        };

        const notifRoot = document.getElementById('notifRoot');
        const newBadgeEl = document.getElementById('notifNewBadge');
        const markAllBtnEl = document.getElementById('markAllReadBtn');
        const clearBtnEl = document.getElementById('clearNotifsBtn');
        const tabsEl = document.querySelector('.notif-tabs');

        let currentFilter = 'all';

        const toDateOnly = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());

        const formatRelative = (iso) => {
            const d = new Date(String(iso || ''));
            if (Number.isNaN(d.getTime())) return '-';

            const now = new Date();
            const diffMs = d.getTime() - now.getTime();
            const abs = Math.abs(diffMs);
            const minutes = Math.round(abs / 60000);
            const hours = Math.round(abs / 3600000);
            const days = Math.round(abs / 86400000);

            const rtf = typeof Intl !== 'undefined' && Intl.RelativeTimeFormat ? new Intl.RelativeTimeFormat('en', { numeric: 'auto' }) : null;
            const sign = diffMs < 0 ? -1 : 1;

            if (minutes < 60) return rtf ? rtf.format(sign * minutes, 'minute') : `${minutes} min`;
            if (hours < 24) return rtf ? rtf.format(sign * hours, 'hour') : `${hours} hr`;
            return rtf ? rtf.format(sign * days, 'day') : `${days} day`;
        };

        const dayLabel = (iso) => {
            const d = new Date(String(iso || ''));
            if (Number.isNaN(d.getTime())) return '';
            const today = toDateOnly(new Date());
            const that = toDateOnly(d);
            const diffDays = Math.round((today.getTime() - that.getTime()) / 86400000);
            if (diffDays === 0) return 'TODAY';
            if (diffDays === 1) return 'YESTERDAY';
            return d.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: '2-digit' }).toUpperCase();
        };

        const workflowToTone = (wf) => {
            const w = String(wf || '');
            if (w === 'Pending Review') return 'tone-pending';
            if (w === 'Awaiting Payment') return 'tone-payment';
            if (w === 'Awaiting Final Payment') return 'tone-final-payment';
            if (w === 'Proofing') return 'tone-proofing';
            if (w === 'In Progress') return 'tone-progress';
            if (w === 'Ready to Ship') return 'tone-ready';
            if (w === 'On Transit') return 'tone-transit';
            if (w === 'Completed') return 'tone-completed';
            if (w === 'Cancelled') return 'tone-cancelled';
            return 'tone-pending';
        };

        const statusLabelFor = (wf) => {
            const w = String(wf || '');
            if (w === 'Pending Review') return 'Accepted';
            if (w === 'Ready to Ship' || w === 'On Transit') return 'Shipped';
            if (w === 'Completed') return 'Completed';
            if (w === 'Cancelled') return 'Cancelled';
            if (w === 'Awaiting Payment' || w === 'Awaiting Final Payment') return 'Awaiting Payment';
            return 'In progress';
        };

        const categorize = (wf) => {
            const w = String(wf || '');
            if (w === 'Completed') return 'completed';
            if (w === 'On Transit' || w === 'Ready to Ship') return 'shipped';
            if (w === 'Pending Review') return 'accepted';
            return 'in_progress';
        };

        const buildMessage = (wf, orderLabel) => {
            const w = String(wf || '');
            if (w === 'Pending Review') {
                return 'Your order has been accepted. It is now being reviewed.';
            }
            if (w === 'Awaiting Payment') {
                return 'Your order is awaiting payment. Please upload your payment receipt.';
            }
            if (w === 'Awaiting Final Payment') {
                return 'Your order is awaiting final payment. Please upload your payment receipt.';
            }
            if (w === 'Proofing') {
                return 'Your order is in proofing. Please wait for admin to upload the mockup.';
            }
            if (w === 'In Progress') {
                return 'Your order is now in production.';
            }
            if (w === 'Ready to Ship') {
                return 'Your order is packed and will be handed to the courier soon.';
            }
            if (w === 'On Transit') {
                return 'Your order is on its way. Use the tracking number on the order tracking page.';
            }
            if (w === 'Completed') {
                return 'Your order has been completed. Thank you for ordering!';
            }
            return `${orderLabel} status updated.`;
        };

        const iconFor = (wf) => {
            const w = String(wf || '');
            if (w === 'On Transit' || w === 'Ready to Ship') {
                return `
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 7h11v10H3z" />
                        <path d="M14 10h4l3 3v4h-7z" />
                        <circle cx="7" cy="19" r="1" />
                        <circle cx="17" cy="19" r="1" />
                    </svg>
                `;
            }
            if (w === 'Completed') {
                return `
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 6L9 17l-5-5" />
                    </svg>
                `;
            }
            if (w === 'In Progress' || w === 'Proofing') {
                return `
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 6v6l4 2" />
                        <path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0" />
                    </svg>
                `;
            }
            if (w === 'Awaiting Payment' || w === 'Awaiting Final Payment') {
                return `
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 1v22" />
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H14a3.5 3.5 0 0 1 0 7H6" />
                    </svg>
                `;
            }
            return `
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 22a2 2 0 0 0 2-2" />
                    <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
                    <path d="M10 20a2 2 0 0 0 4 0" />
                </svg>
            `;
        };

        const renderNotifications = () => {
            const list = window.AlixOrderNotifications?.getAll ? window.AlixOrderNotifications.getAll() : [];
            const unread = window.AlixOrderNotifications?.getUnreadCount ? window.AlixOrderNotifications.getUnreadCount() : 0;

            if (newBadgeEl) {
                newBadgeEl.textContent = `${unread} new`;
                newBadgeEl.classList.toggle('is-hidden', unread <= 0);
            }

            if (markAllBtnEl) {
                markAllBtnEl.disabled = unread <= 0;
            }

            const filtered = Array.isArray(list)
                ? list.filter((n) => {
                    if (currentFilter === 'all') return true;
                    const wf = String(n?.to_workflow || '').trim();
                    return categorize(wf) === currentFilter;
                })
                : [];

            if (!notifRoot) return;

            if (!filtered.length) {
                notifRoot.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size:28px;">\uD83D\uDD14</div>
                        <h3>No Notifications Yet</h3>
                        <p>We’ll show updates here when your order status changes.</p>
                    </div>
                `;
                return;
            }

            // Group by day label.
            const groups = [];
            let currentDay = null;
            let bucket = [];

            filtered.forEach((n) => {
                const label = dayLabel(n?.at);
                if (currentDay === null) {
                    currentDay = label;
                    bucket = [n];
                    return;
                }
                if (label === currentDay) {
                    bucket.push(n);
                    return;
                }
                groups.push({ day: currentDay, items: bucket });
                currentDay = label;
                bucket = [n];
            });
            groups.push({ day: currentDay, items: bucket });

            notifRoot.innerHTML = groups
                .map((g) => {
                    const cards = g.items
                        .map((n) => {
                            const orderId = String(n?.order_id || '').trim();
                            const orderLabel = orderId ? `Order #${orderId}` : 'Order';
                            const wf = String(n?.to_workflow || '').trim() || (window.AlixOrderNotifications?.getWorkflowDisplay ? window.AlixOrderNotifications.getWorkflowDisplay(n?.to_status) : String(n?.to_status || ''));
                            const tone = workflowToTone(wf);
                            const statusLabel = statusLabelFor(wf);
                            const href = orderId ? `order-tracking.html?id=${encodeURIComponent(orderId)}` : 'order-tracking.html';
                            const when = formatRelative(n?.at);

                            const qty = Number(n?.summary_qty || 0) || 0;
                            const label = String(n?.summary_label || '').trim();
                            const metaLeft = qty > 0 && label ? `${qty} pcs · ${label}` : (label ? label : (qty > 0 ? `${qty} pcs` : ''));

                            const customMessage = typeof n?.message === 'string' ? n.message.trim() : '';
                            const message = customMessage || buildMessage(wf, orderLabel);
                            const unreadAttr = n?.read ? '0' : '1';

                            return `
                                <a class="notif-card" href="${escapeHtml(href)}" data-order-id="${escapeHtml(orderId)}" data-notif-id="${escapeHtml(String(n?.id || ''))}" data-unread="${unreadAttr}">
                                    <div class="notif-avatar">${iconFor(wf)}</div>
                                    <div class="notif-body">
                                        <div class="notif-topline">
                                            <div class="notif-order">${escapeHtml(orderLabel)}</div>
                                            <span class="status-badge ${tone}">${escapeHtml(statusLabel)}</span>
                                        </div>
                                        <div class="notif-message">${escapeHtml(message)}</div>
                                        <div class="notif-meta">
                                            ${metaLeft ? `<span>${escapeHtml(metaLeft)}</span><span class="dot"></span>` : ''}
                                            <span>${escapeHtml(when)}</span>
                                        </div>
                                    </div>
                                    <div class="notif-unread-dot" aria-hidden="true"></div>
                                </a>
                            `;
                        })
                        .join('');

                    return `
                        <div class="notif-day">${escapeHtml(g.day || '')}</div>
                        <div class="notif-list">${cards}</div>
                    `;
                })
                .join('');
        };

        const refreshOrdersForLatestChanges = async () => {
            if (!isAuthed()) {
                const message = 'Please log in first to view notifications.';
                window.AVDialog?.alert(message, { title: 'Notice', tone: 'info' }) || alert(message);
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await window.AlixCart.listOrders({ limit: 200, offset: 0 });
                const apiOrders = Array.isArray(res?.orders) ? res.orders : [];

                const mapDesignProofStatus = (s) => {
                    const v = String(s || '').toLowerCase();
                    if (v === 'approved') return 'Approved';
                    if (v === 'rejected') return 'Revision Requested';
                    if (v === 'submitted' || v === 'reviewing') return 'Sent';
                    return 'Not Sent';
                };

                // Record any new status changes before rendering the list.
                if (window.AlixOrderNotifications?.recordFromOrders) {
                    const changes = window.AlixOrderNotifications.recordFromOrders(
                        apiOrders.map((row) => {
                            const o = row?.order || {};
                            const items = Array.isArray(row?.items) ? row.items : [];
                            const metaFromApi = (o.meta && typeof o.meta === 'object') ? o.meta : {};

                            // Keep parity with order tracking page shape (enough for notifications).
                            return {
                                rawId: o?.order_id,
                                status: o?.status,
                                tracking_number: o?.tracking_number != null ? String(o.tracking_number) : null,
                                meta: { ...metaFromApi },
                                items: items.map((it) => ({
                                    id: it?.order_item_id ?? it?.orderItemId ?? null,
                                    name: it?.meta?.product_name || `Product #${it?.product_id ?? ''}`,
                                    quantity: it?.quantity,
                                    design_proof: it?.design_proof && typeof it.design_proof === 'object'
                                        ? {
                                            status: mapDesignProofStatus(it.design_proof.proof_status),
                                            mockup_data_url: String(it.design_proof.proof_file_path || ''),
                                            revision_note: it.design_proof.revision_note ?? null,
                                            version_number: it.design_proof.version_number ?? null,
                                        }
                                        : null,
                                })),
                            };
                        })
                    );

                    if (changes.length && window.AlixOrderNotifications?.showPopups) {
                        await window.AlixOrderNotifications.showPopups(changes);
                    }
                }
            } catch (error) {
                const message = error?.message || 'Failed to load notifications.';
                window.AVDialog?.alert(message, { title: 'Error', tone: 'danger' }) || alert(message);
            }

            renderNotifications();
        };

        const setFilter = (filter) => {
            currentFilter = String(filter || 'all');
            tabsEl?.querySelectorAll('.notif-tab').forEach((b) => b.classList.toggle('active', String(b.getAttribute('data-filter')) === currentFilter));
            renderNotifications();
        };

        tabsEl?.addEventListener('click', (e) => {
            const btn = e.target && e.target.closest ? e.target.closest('.notif-tab') : null;
            if (!btn) return;
            setFilter(btn.getAttribute('data-filter'));
        });

        markAllBtnEl?.addEventListener('click', () => {
            if (window.AlixOrderNotifications?.markAllRead) {
                window.AlixOrderNotifications.markAllRead();
            }
            renderNotifications();
        });

        clearBtnEl?.addEventListener('click', async () => {
            if (!window.AlixOrderNotifications?.clearAll) return;

            const ok = window.AVDialog?.confirm
                ? await window.AVDialog.confirm('Clear all notifications? This cannot be undone.', {
                    title: 'Clear notifications',
                    tone: 'warning',
                    okText: 'Clear',
                    cancelText: 'Cancel',
                })
                : true;

            if (!ok) return;
            window.AlixOrderNotifications.clearAll();
            renderNotifications();
        });

        // Mark a notification/order as read when clicked, then navigate to order tracking.
        notifRoot?.addEventListener('click', (e) => {
            const card = e.target && e.target.closest ? e.target.closest('.notif-card') : null;
            if (!card) return;

            const orderId = card.getAttribute('data-order-id');
            const href = card.getAttribute('href') || 'order-tracking.html';

            if (orderId && window.AlixOrderNotifications?.markOrderRead) {
                window.AlixOrderNotifications.markOrderRead(orderId);
            }

            e.preventDefault();
            window.location.href = href;
        });

        // Keep UI in sync with updates from other pages (status changes, mark read, etc.)
        if (window.AlixOrderNotifications?.UPDATED_EVENT) {
            window.addEventListener(window.AlixOrderNotifications.UPDATED_EVENT, () => {
                renderNotifications();
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                refreshOrdersForLatestChanges();
            });
        } else {
            refreshOrdersForLatestChanges();
        }
    </script>
</body>
</html>
