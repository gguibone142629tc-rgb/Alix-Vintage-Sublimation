<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=optional">
    <title>Alix Vintage | Cart</title>

    <link rel="stylesheet" href="../css/homepage.css" />
    <link rel="stylesheet" href="../css/sublimation-theme.css" />
    <link rel="stylesheet" href="../css/cart.css" />
</head>

<body>
    <header>
        <div class="nav">
            <a class="logo-wrap" href="homepage.html" aria-label="Go to homepage">
                <img src="../assets/reallogo.png" alt="Alix Vintage logo">
                <span>ALIX VINTAGE</span>
            </a>
            <nav>
                <ul>
                    <li><a href="categories.html" class="nav-shop-link">SHOP NOW</a></li>
                </ul>
            </nav>
            <div class="nav-icons" aria-label="Account and cart">
                <a class="nav-contact-link" href="contact-us.html">Contact</a>
                <a class="nav-login-btn-link" href="login.html">Log In</a>
                <a class="nav-account-link is-hidden" href="order-history.html" aria-label="Account profile">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z" />
                        <path d="M4 20a8 8 0 0 1 16 0" />
                    </svg>
                </a>
                <a class="nav-order-link is-hidden" href="order-history.html" aria-label="Order history">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 6h14l-2 9H8L6 6z" />
                        <path d="M6 6H4" />
                        <circle cx="9" cy="19" r="1" />
                        <circle cx="17" cy="19" r="1" />
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main class="cart-main">
        <div class="cart-card">
            <div class="cart-header cart-header--order">
                <h1 class="cart-title">Order</h1>
            </div>

            <div id="cartItems" class="cart-items" aria-label="Cart items">
                <div class="muted">Loading…</div>
            </div>

            <div class="cart-totals" aria-label="Cart totals">
                <div class="cart-totals-row">
                    <div class="cart-totals-label">Subtotal</div>
                    <div id="cartSubtotal" class="cart-totals-value">₱0.00</div>
                </div>
                <div class="cart-totals-row">
                    <div class="cart-totals-label">Shipping</div>
                    <div id="cartShipping" class="cart-totals-value">₱0.00</div>
                </div>
                <div class="cart-totals-row cart-totals-row--strong">
                    <div class="cart-totals-label">Total</div>
                    <div id="cartTotal" class="cart-totals-value">₱0.00</div>
                </div>
            </div>

            <section class="cart-section" aria-label="Payment method">
                <h2 class="cart-section-title">Payment Method</h2>
                <div class="cart-payment-options">
                    <label class="cart-radio">
                        <input type="radio" name="paymentMethod" value="GCash" checked>
                        <span class="cart-radio-body">
                            <span class="cart-radio-title">GCash</span>
                            <span class="cart-radio-sub">50% downpayment via GCash</span>
                        </span>
                        <span class="cart-radio-icon" aria-hidden="true">
                            <img class="cart-radio-icon-img" src="../assets/icons/Gcash.png" alt="">
                        </span>
                    </label>
                    <label class="cart-radio">
                        <input type="radio" name="paymentMethod" value="COD">
                        <span class="cart-radio-body">
                            <span class="cart-radio-title">Cash on Delivery</span>
                            <span class="cart-radio-sub">50% downpayment, 50% on delivery</span>
                        </span>
                        <span class="cart-radio-icon" aria-hidden="true">
                            <img class="cart-radio-icon-img" src="../assets/icons/Cash_On_Delivery.png" alt="">
                        </span>
                    </label>
                </div>
                <div class="muted cart-payment-note">All orders require a 50% downpayment before proofing/production.</div>
            </section>

            <div class="cart-actions">
                <button id="checkoutBtn" class="btn btn-primary cart-checkout" type="button">Place Order</button>
                <button id="clearCartBtn" class="btn btn-danger cart-clear" type="button">Clear Cart</button>
            </div>
        </div>
    </main>

    <footer class="site-footer"></footer>

    <script src="../js/ui-dialog.js"></script>
    <script src="../js/auth-client.js"></script>
    <script src="../js/nav-auth.js"></script>
    <script src="../js/cart-client.js"></script>

    <script>
        const peso = (value) => {
            const n = Number(value || 0);
            return `\u20B1${n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        };

        const getApiBaseUrl = () => {
            if (window.AlixAuth && typeof window.AlixAuth.apiBaseUrl === "function") {
                return window.AlixAuth.apiBaseUrl();
            }
            const origin = window.location && window.location.origin ? window.location.origin : "";
            if (origin && origin !== "null") return origin;
            return "";
        };

        const resolveAssetUrl = (path) => {
            const raw = String(path || "").trim();
            if (!raw) return "";
            if (/^(data:|blob:|https?:\/\/)/i.test(raw)) return raw;
            const base = getApiBaseUrl().replace(/\/$/, "");
            return raw.startsWith("/") ? `${base}${raw}` : `${base}/${raw}`;
        };

        const safeText = (value) => {
            if (value === null || value === undefined) return '';
            return String(value);
        };

        const escapeHtml = (value) =>
            String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        const uiAlert = async (message, opts = {}) => {
            if (window.AVDialog?.alert) {
                await window.AVDialog.alert(String(message || ''), opts);
                return;
            }
            window.alert(String(message || ''));
        };

        const uiConfirm = async (message, opts = {}) => {
            if (window.AVDialog?.confirm) {
                return await window.AVDialog.confirm(String(message || ''), opts);
            }
            return window.confirm(String(message || ''));
        };

        const getProfileAddress = () => {
            const user = window.AlixAuth && typeof window.AlixAuth.getUser === 'function' ? window.AlixAuth.getUser() : null;
            return String(user?.address || '').trim();
        };

        const ensureProfileAddressOrRedirect = async () => {
            const addr = getProfileAddress();
            if (addr) return addr;

            const go = await uiConfirm('Please set your address in Account Settings before placing an order.', {
                title: 'Address required',
                tone: 'info',
                okText: 'Go to Account Settings',
                cancelText: 'Cancel',
            });
            if (go) {
                window.location.href = 'account-settings.html';
            }
            return null;
        };

        const renderMeta = (meta) => {
            if (!meta || typeof meta !== 'object') return '';

            const lines = [];

            if (meta.playerName || meta.jerseyNumber) {
                const p = [];
                if (meta.playerName) p.push(`Player: ${safeText(meta.playerName)}`);
                if (meta.jerseyNumber) p.push(`Jersey: ${safeText(meta.jerseyNumber)}`);
                lines.push(p.join(' • '));
            }

            if (meta.groupName) {
                lines.push(`Group: ${safeText(meta.groupName)}`);
            }

            if (Array.isArray(meta.roster) && meta.roster.length) {
                lines.push(`Roster: ${meta.roster.length} item(s)`);
            }

            if (meta.customRequest && typeof meta.customRequest === 'object') {
                const cr = meta.customRequest;
                if (cr.designName) lines.push(`Design: ${safeText(cr.designName)}`);
                if (cr.productType) lines.push(`Type: ${safeText(cr.productType)}`);
                if (cr.quantity) lines.push(`Requested Qty: ${safeText(cr.quantity)}`);
                if (cr.notes) lines.push(`Notes: ${safeText(cr.notes)}`);
            }

            if (meta.customerName) lines.push(`Name: ${safeText(meta.customerName)}`);
            if (meta.customerMobile) lines.push(`Mobile: ${safeText(meta.customerMobile)}`);
            if (meta.customerEmail) lines.push(`Email: ${safeText(meta.customerEmail)}`);

            return lines
                .filter(Boolean)
                .map((l) => `<div>${l}</div>`)
                .join('');
        };

            const renderCart = (cartEnvelope) => {
            const cart = cartEnvelope?.cart && typeof cartEnvelope.cart === 'object' ? cartEnvelope.cart : cartEnvelope;
            const items = Array.isArray(cart?.items) ? cart.items : [];

            const subtotal = Number(cart?.total || cart?.total_amount || 0);
            const shipping = 0;
            const total = subtotal + shipping;

            document.getElementById('cartSubtotal').textContent = peso(subtotal);
            document.getElementById('cartShipping').textContent = peso(shipping);
            document.getElementById('cartTotal').textContent = peso(total);

            const wrap = document.getElementById('cartItems');
            wrap.innerHTML = '';

            if (!items.length) {
                wrap.innerHTML = `<div class="muted">Your cart is empty.</div>`;
                return;
            }

            items.forEach((it) => {
                const productName = safeText(it?.product?.product_name || it?.meta?.product_name || it.product_name || it.productName || 'Product');
                const qty = Math.max(1, Number(it.quantity || 1));
                const lineTotal = Number(it.line_total || it.total_amount || 0);
                const price = Number(it.unit_price || it?.product?.base_price || it?.product?.price || it.price || (qty ? lineTotal / qty : 0) || 0);
                const cartItemId = it.cart_item_id ?? it.id;

                const imgPath = it?.product?.image_path || it?.meta?.image_path || it?.meta?.imagePath || '';
                const imgUrl = imgPath ? resolveAssetUrl(imgPath) : '';

                const itemEl = document.createElement('div');
                itemEl.className = 'cart-item';
                itemEl.setAttribute('data-cart-item-id', safeText(cartItemId));
                itemEl.setAttribute('data-product-name', safeText(productName));

                itemEl.innerHTML = `
                    <div class="cart-item-media">
                        ${imgUrl ? `<img class="cart-item-thumb" src="${escapeHtml(imgUrl)}" alt="${escapeHtml(productName)}" loading="lazy" />` : `<div class="cart-item-thumb cart-item-thumb--empty">No image</div>`}
                    </div>

                    <div class="cart-item-main">
                        <div class="cart-item-title">${escapeHtml(productName)}</div>
                        <div class="cart-item-meta muted">${renderMeta(it?.meta || {})}</div>
                    </div>

                    <div class="cart-item-qty" aria-label="Quantity">
                        <div class="qty-sub"><strong>Qty:</strong> ${escapeHtml(qty)}</div>
                        <div class="qty-sub muted">${escapeHtml(peso(price))} each</div>
                    </div>

                    <div class="cart-item-amount" aria-label="Line total">
                        <div class="cart-item-total">${escapeHtml(peso(lineTotal || (price * qty)))}</div>
                    </div>

                    <div class="cart-item-actions">
                        <button type="button" class="cart-remove" data-remove aria-label="Remove">Remove</button>
                    </div>
                `;

                wrap.appendChild(itemEl);
            });
        };

        const refresh = async () => {
            try {
                const cartEnvelope = await window.AlixCart.getCart();
                renderCart(cartEnvelope);
            } catch (e) {
                const msg = (e && e.message) ? e.message : 'Failed to load cart.';
                await uiAlert(msg, { title: 'Error', tone: 'danger' });
                const wrap = document.getElementById('cartItems');
                wrap.innerHTML = `<div class="muted">${safeText(msg)}</div>`;
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('clearCartBtn').addEventListener('click', async () => {
                const ok = await uiConfirm('Clear all items in your cart?', {
                    title: 'Confirm',
                    tone: 'danger',
                    okText: 'Clear',
                    cancelText: 'Cancel',
                });
                if (!ok) return;
                try {
                    await window.AlixCart.clearCart();
                    await refresh();
                } catch (e) {
                    await uiAlert(e?.message || 'Failed to clear cart.', { title: 'Error', tone: 'danger' });
                }
            });

            document.getElementById('checkoutBtn').addEventListener('click', async () => {
                if (!localStorage.getItem('alix_auth_token')) {
                    await uiAlert('Please log in to place an order.', { title: 'Login required', tone: 'info' });
                    window.location.href = 'login.html';
                    return;
                }

                const addr = await ensureProfileAddressOrRedirect();
                if (!addr) return;

                const ok = await uiConfirm('Place order for all items in your cart?', {
                    title: 'Confirm',
                    tone: 'info',
                    okText: 'Place Order',
                    cancelText: 'Cancel',
                });
                if (!ok) return;
                try {
                    const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked')?.value || 'GCash';
                    await window.AlixCart.checkout({ payment_method: paymentMethod });
                    await uiAlert('Order placed successfully.', { title: 'Success', tone: 'success', okText: 'Continue' });
                    window.location.href = 'order-history.html';
                } catch (e) {
                    await uiAlert(e?.message || 'Checkout failed.', { title: 'Error', tone: 'danger' });
                }
            });

            document.getElementById('cartItems').addEventListener('click', async (e) => {
                const item = e.target.closest('.cart-item');
                if (!item) return;

                const itemId = item.getAttribute('data-cart-item-id');
                if (!itemId) return;

                if (e.target.closest('[data-remove]')) {
                    const ok = await uiConfirm('Remove this item from your cart?', {
                        title: 'Confirm',
                        tone: 'danger',
                        okText: 'Remove',
                        cancelText: 'Cancel',
                    });
                    if (!ok) return;
                    try {
                        await window.AlixCart.removeItem(itemId);
                        await refresh();
                    } catch (err) {
                        await uiAlert(err?.message || 'Failed to remove item.', { title: 'Error', tone: 'danger' });
                    }
                    return;
                }
            });

            refresh();
        });
    </script>

</body>

</html>
