<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=optional">
    <title>Admin | Activity Logs</title>
    <link rel="stylesheet" href="../css/admin-homepage.css">
    <link rel="stylesheet" href="../css/sublimation-theme.css">
</head>
<body>
    <div class="admin-shell">
        <aside class="admin-sidebar" aria-label="Admin sidebar">
            <div class="sidebar-brand">
                <img class="brand-logo" src="../assets/reallogo.png" alt="Alix Vintage logo">
                <div class="brand-text">
                    <div class="brand-name">Alix Vintage</div>
                    <div class="brand-sub">Admin Dashboard</div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Main Menu</div>
                <nav class="sidebar-nav" aria-label="Main menu">
                    <a href="admin-homepage.html" class="nav-item">Dashboard</a>
                    <a href="admin-orders.html" class="nav-item">Order Management</a>
                </nav>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Product</div>
                <nav class="sidebar-nav" aria-label="Product menu">
                    <a href="admin-products.html" class="nav-item">Add / Manage Products</a>
                    <a href="admin-product-list.html" class="nav-item">Product List (Store)</a>
                </nav>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">System</div>
                <nav class="sidebar-nav" aria-label="System menu">
                    <a href="admin-messages.html" class="nav-item">Messages</a>
                    <a href="admin-activity-logs.html" class="nav-item">Activity Logs</a>
                    <a href="#" class="nav-item">Settings</a>
                </nav>
            </div>
        </aside>

        <div class="admin-main">
            <div class="topbar" role="banner">
                <div class="topbar-left">
                    <div class="topbar-title">Activity Logs</div>
                </div>

                <div class="topbar-right">
                    <a class="icon-btn" href="admin-messages.html" aria-label="Messages">
                        <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 4h16v12H5.2L4 17.2V4z"></path>
                            <path d="M4 6l8 6 8-6"></path>
                        </svg>
                    </a>
                </div>
            </div>

            <div class="page-content">
                <section class="panel panel-wide" aria-label="Activity logs list">
                    <div class="panel-head">
                        <h2 class="panel-title">System Activity</h2>
                        <div class="panel-actions" style="display:flex; gap:8px; align-items:center;">
                            <button type="button" class="btn" id="refreshLogsBtn">Refresh</button>
                        </div>
                    </div>

                    <div class="table-wrap">
                        <table class="data-table" aria-label="Activity logs">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Role</th>
                                    <th>Actor</th>
                                    <th>Action</th>
                                    <th>Description</th>
                                    <th>IP</th>
                                </tr>
                            </thead>
                            <tbody id="activityLogsBody">
                                <tr><td colspan="6">Loading activity logs...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="panel-foot" style="display:flex; justify-content:space-between; gap:10px; align-items:center; margin-top:12px;">
                        <div id="activityLogsMeta" style="opacity:0.8; font-weight:700;">&nbsp;</div>
                        <div style="display:flex; gap:8px;">
                            <button type="button" class="btn" id="prevLogsBtn">Previous</button>
                            <button type="button" class="btn" id="nextLogsBtn">Next</button>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="../js/admin-auth.js"></script>
    <script src="../js/admin-realtime-messages.js"></script>
    <script src="../js/admin-activity-logs.js"></script>
</body>
</html>
