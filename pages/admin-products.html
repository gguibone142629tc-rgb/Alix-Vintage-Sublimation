<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../assets/reallogo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=optional">
    <title>Admin | Product Management</title>
    <link rel="stylesheet" href="../css/admin-homepage.css?v=4">
    <link rel="stylesheet" href="../css/sublimation-theme.css?v=4">
</head>
<body class="admin-page">
    <div class="admin-shell">
        <aside class="admin-sidebar" aria-label="Admin sidebar">
            <div class="sidebar-brand">
                <img class="brand-logo" src="../assets/reallogo.png" alt="Alix Vintage logo">
                <div class="brand-text">
                    <div class="brand-name">Alix Vintage</div>
                    <div class="brand-sub">Admin Dashboard</div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Main Menu</div>
                <nav class="sidebar-nav" aria-label="Main menu">
                    <a href="admin-homepage.html" class="nav-item">Dashboard</a>
                    <a href="admin-orders.html" class="nav-item">Order Management</a>
                </nav>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Product</div>
                <nav class="sidebar-nav" aria-label="Product menu">
                    <a href="admin-products.html" class="nav-item active">Add / Manage Products</a>
                    <a href="admin-product-list.html" class="nav-item">Product List (Store)</a>
                </nav>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">System</div>
                <nav class="sidebar-nav" aria-label="System menu">
                    <a href="admin-messages.html" class="nav-item">Messages</a>
                </nav>
            </div>
        </aside>

        <div class="admin-main">
            <div class="topbar" role="banner">
                <div class="topbar-title">Product Management</div>

                <div class="topbar-right">
                    <div class="topbar-search" role="search">
                        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="M20 20l-3.5-3.5"></path>
                        </svg>
                        <input class="search-input" id="productSearch" type="search" placeholder="Search products..." aria-label="Search products">
                    </div>

                    <a class="icon-btn" href="admin-messages.html" aria-label="Messages">
                        <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 4h16v12H5.2L4 17.2V4z"></path>
                            <path d="M4 6l8 6 8-6"></path>
                        </svg>
                    </a>

                    <button class="admin-menu" type="button" aria-label="Admin menu">
                        <span class="admin-avatar" aria-hidden="true">AD</span>
                        <span class="admin-name">Admin</span>
                        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 9l6 6 6-6"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="page-content">
                <section class="panel panel-wide" aria-label="Add or update product">
                    <div class="panel-head">
                        <h2 class="panel-title">Add / Update Product</h2>
                    </div>

                    <form class="admin-form" id="productForm">
                        <input type="hidden" id="productId">
                        <div class="form-row">
                            <div class="field">
                                <label class="field-label" for="productName">Product Name</label>
                                <input class="field-input" id="productName" type="text" placeholder="e.g., Sublimation Jersey" required>
                            </div>
                            <div class="field">
                                <label class="field-label" for="productCategory">Category</label>
                                <select class="field-input" id="productCategory" required>
                                    <option value="" selected disabled>Select category</option>
                                    <option value="jersey">Jersey</option>
                                    <option value="shirt">Shirt</option>
                                    <option value="hoodie">Hoodie</option>
                                    <option value="shorts">Shorts</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="field">
                                <label class="field-label" for="productPrice">Price (₱)</label>
                                <input class="field-input" id="productPrice" type="number" min="0" step="1" placeholder="1200" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="field" style="grid-column: span 3;">
                                <label class="field-label" for="productCollection">Collection</label>
                                <select class="field-input" id="productCollection">
                                    <option value="">(None)</option>
                                    <option value="basketball">Basketball Apparel</option>
                                    <option value="volleyball">Volleyball Uniforms</option>
                                    <option value="football-soccer">Football &amp; Soccer Kits</option>
                                    <option value="corporate-event">Corporate &amp; Event Wear</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="field">
                                <label class="field-label" for="productImageFront">Image (Front)</label>
                                <input class="field-input" id="productImageFront" type="file" accept="image/*">
                                <input type="hidden" id="productImageFrontDataUrl">
                            </div>
                            <div class="field">
                                <label class="field-label" for="productImageBack">Image (Back)</label>
                                <input class="field-input" id="productImageBack" type="file" accept="image/*">
                                <input type="hidden" id="productImageBackDataUrl">
                            </div>
                            <div class="field">
                                <label class="field-label" for="productImageLower">Image (Lower)</label>
                                <input class="field-input" id="productImageLower" type="file" accept="image/*">
                                <input type="hidden" id="productImageLowerDataUrl">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="field">
                                <label class="field-label" for="productImageFull">Image (Full)</label>
                                <input class="field-input" id="productImageFull" type="file" accept="image/*">
                                <input type="hidden" id="productImageFullDataUrl">
                            </div>
                            <div class="field" style="grid-column: span 2;">
                                <div class="image-preview" id="imagePreview" aria-label="Image preview"></div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button class="table-btn" type="submit" id="saveProductBtn">Save Product</button>
                            <button class="table-btn" type="button" id="resetProductBtn">Reset</button>
                        </div>
                    </form>
                </section>

                <section class="panel panel-wide" aria-label="Product list">
                    <div class="panel-head">
                        <h2 class="panel-title">Products</h2>
                    </div>

                    <div class="table-wrap">
                        <table class="data-table" id="productsTable">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Updated</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="productsTbody"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="../js/ui-dialog.js"></script>
    <script src="../js/auth-client.js?v=3"></script>
    <script src="../js/admin-auth.js?v=6"></script>
    <script src="../js/admin-realtime-messages.js"></script>
    <script src="../js/admin-products.js"></script>
</body>
</html>
