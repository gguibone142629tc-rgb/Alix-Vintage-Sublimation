<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=optional">
    <title>Admin Messages | Alix Vintage</title>
    <link rel="stylesheet" href="../css/admin-homepage.css?v=3">
    <link rel="stylesheet" href="../css/sublimation-theme.css?v=3">
</head>
<body>
    <div class="admin-shell">
        <aside class="admin-sidebar" aria-label="Admin sidebar">
            <div class="sidebar-brand">
                <img class="brand-logo" src="../assets/reallogo.png" alt="Alix Vintage logo">
                <div class="brand-text">
                    <div class="brand-name">Alix Vintage</div>
                    <div class="brand-sub">Admin Dashboard</div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Main Menu</div>
                <nav class="sidebar-nav" aria-label="Main menu">
                    <a href="admin-homepage.html" class="nav-item">Dashboard</a>
                    <a href="admin-orders.html" class="nav-item">Order Management</a>
                </nav>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Product</div>
                <nav class="sidebar-nav" aria-label="Product menu">
                    <a href="admin-products.html" class="nav-item">Add / Manage Products</a>
                    <a href="admin-product-list.html" class="nav-item">Product List (Store)</a>
                </nav>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">System</div>
                <nav class="sidebar-nav" aria-label="System menu">
                    <a href="admin-messages.html" class="nav-item active">Messages</a>
                </nav>
            </div>
        </aside>

        <div class="admin-main">
            <div class="topbar" role="banner">
                <div class="topbar-title">Messages</div>

                <div class="topbar-right">
                    <a class="icon-btn" href="admin-messages.html" aria-label="Messages">
                        <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 4h16v12H5.2L4 17.2V4z"></path>
                            <path d="M4 6l8 6 8-6"></path>
                        </svg>
                    </a>

                    <button class="admin-menu" type="button" aria-label="Admin menu">
                        <span class="admin-avatar" aria-hidden="true">AD</span>
                        <span class="admin-name">Admin</span>
                        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 9l6 6 6-6"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="page-content">
                <section class="panel panel-wide" aria-label="Customer inquiries">
                    <div class="panel-head">
                        <h2 class="panel-title">Customer Inquiries</h2>
                    </div>

                    <div class="table-wrap">
                        <table class="data-table" id="messagesTable">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Topic</th>
                                    <th>Message</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="7">Loading messages...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="../js/admin-auth.js"></script>
    <script src="../js/admin-realtime-messages.js"></script>
    <script src="../js/admin-messages.js"></script>
</body>
</html>
